name: Validate extension

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test extension (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install extension-capable Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Run unit, manifest, and browser tests
        run: npm run verify

  required:
    name: Test extension
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Confirm platform matrix
        shell: bash
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
        run: test "$MATRIX_RESULT" = "success"
