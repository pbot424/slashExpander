name: Publish GitHub release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish extension
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install extension-capable Chromium
        run: npx playwright-core install chromium

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run version:check

      - name: Build validated extension ZIP
        run: npm run release

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME "dist/slash-expander-$env:GITHUB_REF_NAME.zip" `
            --verify-tag `
            --generate-notes `
            --title "/Expander $env:GITHUB_REF_NAME"
