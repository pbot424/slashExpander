name: Publish GitHub release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish extension
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw -LiteralPath "manifest.json" | ConvertFrom-Json
          $expectedTag = "v$($manifest.version)"

          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag '$env:GITHUB_REF_NAME' must match manifest version '$expectedTag'."
          }

          "RELEASE_ARCHIVE=dist/slash-expander-$expectedTag.zip" >> $env:GITHUB_ENV

      - name: Build validated extension ZIP
        run: npm run release

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME $env:RELEASE_ARCHIVE `
            --verify-tag `
            --generate-notes `
            --title "/Expander $env:GITHUB_REF_NAME"
