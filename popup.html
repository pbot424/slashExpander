<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>/Expander</title>
    <link rel="stylesheet" href="shared/ui.css">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <div class="brand-lockup">
          <img class="brand-mark" src="assets/icon.svg" width="36" height="36" alt="">
          <h1>Expander</h1>
        </div>
      </header>

      <section class="test-area">
        <textarea id="quick-test" rows="2" spellcheck="false" aria-label="Try your command here" aria-describedby="test-hint" placeholder="Try your command here"></textarea>
        <p id="test-hint"></p>
      </section>

      <section id="page-status" class="page-status" aria-live="polite">
        <span id="page-status-dot" class="page-status-dot" aria-hidden="true"></span>
        <div>
          <strong id="page-status-title">Checking this page…</strong>
          <p id="page-status-detail"></p>
        </div>
        <button id="reactivate-page" type="button" hidden>Reactivate</button>
      </section>

      <button id="site-toggle" class="site-toggle" type="button" aria-pressed="false" hidden></button>

      <div class="popup-actions">
        <button id="new-command" class="primary-button" type="button">New command</button>
        <button id="manage-commands" class="secondary-button" type="button">Manage</button>
      </div>

      <footer class="creator-footer">
        <p>Created by <a href="https://presbot.dev" target="_blank" rel="noopener noreferrer">presbot</a></p>
      </footer>
    </main>

    <dialog id="fill-in-dialog" class="fill-in-dialog" aria-labelledby="fill-in-title">
      <div class="fill-in-header">
        <div><h2 id="fill-in-title">Complete command</h2><p id="fill-in-subtitle"></p></div>
        <button id="close-fill-in" type="button" aria-label="Cancel command expansion">×</button>
      </div>
      <form id="fill-in-form" novalidate>
        <div id="fill-in-fields" class="fill-in-fields"></div>
        <div class="fill-in-actions">
          <button class="primary-button" type="submit">Insert command</button>
          <button id="cancel-fill-in" class="secondary-button" type="button">Cancel</button>
        </div>
        <p id="fill-in-message" class="fill-in-message" role="status" aria-live="polite"></p>
      </form>
    </dialog>

    <script src="shared/defaults.js"></script>
    <script src="shared/template-engine.js"></script>
    <script src="shared/expansion-core.js"></script>
    <script src="shared/storage.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
